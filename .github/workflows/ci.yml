name: Eval suite tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dataset checks, metric tests, baseline gate, LLM plumbing (no API key needed)
        run: pytest
      - name: Baseline evaluation report
        run: python -m dedupe.run --matcher rules --out reports/rules
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: reports/rules/
